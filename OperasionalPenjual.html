<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Operasional Penjual</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#0A2556",
            background: "#F7FFFF",
            surface: "#ffffff",
            "surface-container": "#f3f4f6",
            "outline-variant": "#e5e7eb",
            mustard: "#febf1c"
          },
          fontFamily: {
            display: ["Plus Jakarta Sans"],
            body: ["Inter"]
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="operasional.css">
</head>

<body class="bg-background min-h-screen">

  <div class="flex min-h-screen">
<!--sidebar-->
    <aside class="hidden lg:flex fixed left-0 top-0 h-screen w-72 bg-primary flex-col p-8 text-white z-50"> <!-- fixed = sidebar tetap di tempat saat scroll-->
      <div>
        <h1 class="text-3xl font-bold text-yellow-400">
                    Kantin Hungry
                </h1>
        
      </div>

      <nav class="mt-16 space-y-4">
        <button onclick="goHome()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/10 transition-all">
          <span class="material-symbols-outlined">home</span>
          <span>Beranda</span>
        </button>

        <button onclick="goMenuKedua()" class="w-full flex items-center gap-3 bg-white/10 px-4 py-3 rounded-xl">
          <span class="material-symbols-outlined">store</span>
          <span>Operasional</span>
        </button>

        <button onclick="window.location.href='CekStatus.html'" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/10 transition-all">
          <span class="material-symbols-outlined">notifications</span>
          <span>Status</span>
        </button>

        <button onclick="window.location.href='Profil.html'" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/10 transition-all">
          <span class="material-symbols-outlined">person</span>
          <span>Akun</span>
        </button>
      </nav>
    </aside>

    <div class="flex-1 lg:ml-72">

      <header class="bg-white sticky top-0 z-40 border-b border-outline-variant h-16 flex items-center justify-between px-5 lg:px-8">

        <!--timbol back mobile-->

        <div class="flex items-center gap-3">
          <button id="btnBack" class="lg:hidden w-10 h-10 rounded-full hover:bg-gray-100 flex items-center justify-center">
            <span class="material-symbols-outlined text-primary">arrow_back</span>
          </button>

          <div>
            <h1 class="text-xl lg:text-2xl font-bold text-primary">Operasional</h1>
            <p class="text-xs text-gray-500 hidden sm:block">Kelola pesanan masuk</p>
          </div>
        </div>

        <button onclick="window.location.href='CekStatus.html'" class="relative w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 transition">
          <span class="material-symbols-outlined text-primary">notifications</span>
          <span class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full"></span>
        </button>
      </header>

<!--Main class input pencarian menu-->

      <main class="p-5 lg:p-8 space-y-6">

        <section class="flex flex-col sm:flex-row gap-3">
          <div class="flex-1 relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">search</span>
            <input id="searchInput" class="w-full bg-white border border-outline-variant rounded-xl py-3 pl-10 pr-4 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" placeholder="Cari nomor pesanan..." type="text" />
          </div>

          <!--Membuka menu filter-->

          <div class="relative">
            <button id="btnFilter" class="w-full sm:w-auto bg-primary text-white px-5 py-3 rounded-xl hover:opacity-90 transition-all flex items-center justify-center gap-2">
              <span class="material-symbols-outlined">tune</span>
              <span class="sm:hidden">Filter</span>
            </button>
          
            <!--menyimpan data menu custom pada htlm agar js dapat mudah membaca status filter-->
            <div id="filterMenu" class="hidden absolute right-0 mt-2 bg-white border border-outline-variant rounded-xl shadow-lg w-44 overflow-hidden z-50">
              <button class="filterOption w-full text-left px-4 py-3 hover:bg-gray-100" data-filter="semua">Semua</button>
              <button class="filterOption w-full text-left px-4 py-3 hover:bg-gray-100" data-filter="diproses">Diproses</button>
              <button class="filterOption w-full text-left px-4 py-3 hover:bg-gray-100" data-filter="selesai">Selesai</button>
              <button class="filterOption w-full text-left px-4 py-3 hover:bg-gray-100" data-filter="batal">Batal</button>
            </div>
          </div>
        </section>

        <!--tombol filter status pesanan-->
        <nav class="flex gap-2 overflow-x-auto pb-1"> <!--jika tombol terlalu banyak di hp bisa digeser horizontal-->
          <button class="statusBtn whitespace-nowrap px-5 py-2 bg-primary text-white text-sm font-semibold rounded-full" data-status="semua">Semua</button>
          <button class="statusBtn whitespace-nowrap px-5 py-2 bg-gray-100 text-gray-600 text-sm font-semibold rounded-full" data-status="diproses">Diproses</button>
          <button class="statusBtn whitespace-nowrap px-5 py-2 bg-gray-100 text-gray-600 text-sm font-semibold rounded-full" data-status="selesai">Selesai</button>
          <button class="statusBtn whitespace-nowrap px-5 py-2 bg-gray-100 text-gray-600 text-sm font-semibold rounded-full" data-status="batal">Batal</button>
        </nav>

        <section id="orderList" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
            </section>

      </main>
      </main>
    </div>
  </div>

  <!--MOBILE NAVIGATION-->
  <nav class="mobile-nav fixed bottom-0 left-0 w-full flex justify-around items-center px-2 bg-white border-t border-outline-variant shadow-lg z-50 h-16 lg:hidden">
    <button onclick="goHome()" class="flex flex-col items-center justify-center text-gray-500">
      <span class="material-symbols-outlined">home</span>
      <span class="text-[10px] font-semibold">Home</span>
    </button>

    <button class="flex flex-col items-center justify-center text-primary font-bold">
      <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">store</span>
      <span class="text-[10px] font-semibold">Operasional</span>
    </button>

    
    <button onclick="window.location.href='CekStatus.html'" class="flex flex-col items-center justify-center text-gray-500">
      <span class="material-symbols-outlined">notifications</span>
      <span class="text-[10px] font-semibold">Status</span>
    </button>

    <button onclick="window.location.href='Profil.html'" class="flex flex-col items-center justify-center text-gray-500">
      <span class="material-symbols-outlined">person</span>
      <span class="text-[10px] font-semibold">Akun</span>
    </button>
  </nav>

  <script src="Operasional.js"></script>
</body>

</html>>
