<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cek Status Pesanan</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Font -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap">

    <!-- Icon -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">

    <!-- CSS -->
    <link rel="stylesheet" href="cekStatus.css">

    <!-- Konfigurasi Tailwind -->
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {

                    colors: {
                        "navy-custom": "#0A2556",
                        "background": "#f5f7fb",
                        "surface": "#ffffff",
                        "surface-container-low": "#f3f3f4",
                        "outline-variant": "#d9dce3",
                        "outline": "#75777d",
                        "on-surface": "#1a1c1c",
                        "on-surface-variant": "#667085",
                    },

                    fontFamily: {
                        "headline-md": ["Plus Jakarta Sans"],
                        "body-md": ["Inter"],
                    }
                }
            }
        }
    </script>


</head>

<body class="bg-background">

    <div class="flex min-h-screen">

        <!-- SIDEBAR -->
        <aside class="hidden lg:flex fixed left-0 top-0 h-screen w-72 bg-[#0A2556] flex-col p-8 text-white z-50">

            <!-- LOGO -->
            <div>

                <h1 class="text-3xl font-bold text-yellow-400">
                    Kantin Hungry
                </h1>


            </div>

            <!-- MENU -->
            <nav class="mt-14 flex flex-col gap-3">

                <!-- BERANDA -->
                <button onclick="goHome()"
                    class="w-full flex items-center gap-4 px-5 py-4 rounded-2xl hover:bg-white/10 transition-all">

                    <span class="material-symbols-outlined">
                        home
                    </span>

                    <span class="font-medium">
                        Beranda
                    </span>

                </button>

                <!-- MENU KEDUA -->
                <button onclick="goMenuKedua()"
                    class="w-full flex items-center gap-4 px-5 py-4 rounded-2xl hover:bg-white/10 transition-all">

                    <span id="iconMenuKeduaDesktop" class="material-symbols-outlined">

                        shopping_cart

                    </span>

                    <span id="textMenuKeduaDesktop" class="font-medium">

                        Pesanan

                    </span>

                </button>

                <!-- STATUS -->
                <button class="w-full flex items-center gap-4 px-5 py-4 rounded-2xl bg-white/10 transition-all">

                    <span class="material-symbols-outlined">
                        notifications
                    </span>

                    <span class="font-medium">
                        Status
                    </span>

                </button>

                <!-- AKUN -->
                <button onclick="window.location.href='Profil.html'"
                    class="w-full flex items-center gap-4 px-5 py-4 rounded-2xl hover:bg-white/10 transition-all">

                    <span class="material-symbols-outlined">
                        person
                    </span>

                    <span class="font-medium">
                        Akun
                    </span>

                </button>

            </nav>

        </aside>

        <!-- MAIN -->
        <div class="flex-1 lg:ml-72 min-h-screen">

            <!-- HEADER -->
            <header
                class="bg-white border-b border-outline-variant sticky top-0 z-40 h-16 flex items-center justify-between px-5 md:px-8">

                <div class="flex items-center gap-3">

                    <!-- BACK MOBILE -->
                    <button id="btnBack"
                        class="lg:hidden w-10 h-10 rounded-full hover:bg-gray-100 flex items-center justify-center">

                        <span class="material-symbols-outlined">
                            arrow_back
                        </span>

                    </button>

                    <div>

                        <h1 class="text-xl md:text-2xl font-bold text-navy-custom">
                            Cek Status Pesanan
                        </h1>

                        <p class="text-sm text-gray-500 hidden md:block">
                            Pantau status pesanan pelanggan
                        </p>

                    </div>

                </div>

                <!-- NOTIF -->
                <button class="w-10 h-10 rounded-full hover:bg-gray-100 flex items-center justify-center">

                    <span class="material-symbols-outlined">
                        notifications
                    </span>

                </button>

            </header>

            <!-- CONTENT -->
            <main class="p-4 sm:p-6 md:p-8">

                <div
                    class="bg-white rounded-3xl shadow-sm border border-outline-variant p-5 sm:p-6 md:p-8 max-w-6xl mx-auto">

                    <!-- JUDUL -->
                    <div class="mb-8">

                        <h2 class="text-3xl font-bold text-navy-custom">
                            Status Pesanan
                        </h2>

                        <p class="text-gray-500 mt-2">
                            Masukkan nomor pesanan untuk melihat status terbaru
                        </p>

                    </div>

                    <!-- INPUT -->
                    <div class="grid grid-cols-1 lg:grid-cols-[1fr_auto] gap-4 mb-10">

                        <input id="nomorPesanan" type="text" placeholder="Contoh: #KH-9921"
                            class="h-14 rounded-2xl border border-outline-variant bg-surface-container-low px-5 outline-none focus:ring-2 focus:ring-navy-custom">

                        <button id="btnCekStatus"
                            class="h-14 px-8 bg-navy-custom text-white rounded-2xl font-semibold hover:opacity-90 transition-all">

                            Cek Status

                        </button> <!--menjalankan proses pengecekan status pesananan-->

                    </div>


                    <!-- LIST PESANAN -->
                    <div id="listPesanan" class="space-y-4 mb-6"></div>

                    <!-- TOTAL -->
                    <div id="totalHarga" class="text-xl font-bold text-navy-custom mb-10">
                    </div>

                    <!-- TIMELINE -->
                    <div id="timelineContainer" class="relative ml-2">
                        <div class="absolute left-[11px] top-4 bottom-4 w-0.5 bg-gray-200"></div>
                        <div id="timelineItems"></div>


                        <!-- TAMBAHKAN INI: Kontainer pesan jika pesanan dibatalkan -->
                        <div id="pesanDibatalkan"
                            class="hidden mt-6 p-4 bg-red-50 border border-red-200 rounded-2xl flex items-center gap-3 text-red-700">
                            <span class="material-symbols-outlined text-red-500">cancel</span>
                            <div>
                                <h4 class="font-bold">Pesanan Dibatalkan</h4>
                                <p class="text-xs text-red-600 mt-0.5">Maaf, pesanan ini telah dibatalkan oleh pihak
                                    kantin.</p>
                            </div>
                        </div>
                    </div>
                    <!-- Tombol Batal Khusus Penjual -->
                    <script>
                        // Logika menampilkan tombol hanya jika usernya penjual
                        const userAkses = JSON.parse(localStorage.getItem("user"));
                        if (userAkses && userAkses.role === "penjual") {
                            document.write(`
            <button onclick="ubahStatus('batal')" class="mt-2 px-4 py-2 bg-red-600 text-white rounded-xl text-sm font-semibold hover:bg-red-700 transition">
                Batalkan Pesanan Ini
            </button>
        `);
                        }
                    </script>


                </div>
            </main>
        </div>
    </div>
    <nav
        class="lg:hidden fixed bottom-0 left-0 w-full bg-white border-t border-outline-variant h-16 flex justify-around items-center z-50">
        <button onclick="goHome()" class="flex flex-col items-center justify-center text-gray-500">
            <span class="material-symbols-outlined">home</span>
            <span class="text-[10px] font-semibold">Home</span>
        </button>
        <button onclick="goMenuKedua()" class="flex flex-col items-center justify-center text-gray-500">
            <span id="iconMenuKeduaMobile" class="material-symbols-outlined">shopping_cart</span>
            <span id="textMenuKeduaMobile" class="text-[10px] font-semibold">Pesanan</span>
        </button>


        <button class="flex flex-col items-center justify-center text-navy-custom font-bold">
            <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1">notifications</span>
            <span class="text-[10px] font-semibold">Status</span>
        </button>
        <button onclick="window.location.href='Profil.html'"
            class="flex flex-col items-center justify-center text-gray-500">
            <span class="material-symbols-outlined">person</span>
            <span class="text-[10px] font-semibold">Akun</span>
        </button>
    </nav>

    <script src="cekStatus.js"></script>
</body>

</html>

<!-- JAVASCRIPT -->
<script src="cekStatus.js"></script>

</body>

</html>>
