<!DOCTYPE html>
<html class="light" lang="id">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap"
        rel="stylesheet" />

    <!-- Icon -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />

    <!-- Konfigurasi Tailwind -->
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary-container": "#0A2556",
                        "secondary-container": "#febf1c",
                        "background": "#F7FFFF",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#f3f4f6",
                        "surface-container-low": "#f3f3f4",
                        "outline-variant": "#e5e7eb",
                        "on-surface": "#1a1c1c",
                        "on-surface-variant": "#44474d",
                        "primary": "#0A2556",
                        "mustard": "#EAB308"
                    },

                    fontFamily: {
                        "headline-md": ["Plus Jakarta Sans"],
                        "body-md": ["Inter"],
                        "display-lg": ["Plus Jakarta Sans"]
                    }
                }
            }
        }
    </script>

    <!-- File CSS -->
    <link rel="stylesheet" href="dashboard.css">

    <title>Dashboard Pembeli</title>
</head>

<body class="bg-background text-on-surface min-h-screen lg:pb-0">

    <!-- SIDEBAR DESKTOP -->

        <div>

                    Kantin Hungry

        <!-- MENU -->
        <nav class="mt-16 space-y-4">

            <button

                <span class="material-symbols-outlined">
                    home

                <span>Beranda</span>

            </button>

            <button
                onclick="goMenuKedua()"
                class="w-full flex items-center gap-3 hover:bg-white/10 px-4 py-3 rounded-xl transition-all">

                    shopping_cart
                </span>

                <span>Pesanan</span>

            </button>

            <button
                onclick="window.location.href='CekStatus.html'"
                class="w-full flex items-center gap-3 hover:bg-white/10 px-4 py-3 rounded-xl transition-all">

                <span class="material-symbols-outlined">
                    notifications
                </span>

                <span>Status</span>

            </button>

            <button
                onclick="window.location.href='Profil.html'"
                class="w-full flex items-center gap-3 hover:bg-white/10 px-4 py-3 rounded-xl transition-all">

                <span class="material-symbols-outlined">
                    person
                </span>

                <span>Akun</span>

            </button>

        </nav>

    </aside>

        <div class="flex items-center gap-3">

            <span id="btnBack"

            </span>

        </div>

        <!-- RIGHT -->
        <div class="flex items-center gap-4">

            <button onclick="window.location.href='CekStatus.html'">

                <span

                    notifications

            </button>

        </div>

                        <div class="absolute top-0 right-0 p-2">

                            </span>

                        </div>

                        <span class="text-sm text-on-surface-variant">

                                timer

                            </span>

                        </div>

                    </div>

                    <!-- CARD 2 -->
                    <div
                        class="bg-white p-5 lg:p-6 rounded-xl border border-outline-variant shadow-sm relative overflow-hidden">

                        <div class="absolute top-0 right-0 p-2">

                            <span
                                class="px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-emerald-100 text-emerald-700">

                                Selesai

                            </span>

                        </div>

                        <span class="text-sm text-on-surface-variant">
                            Selesai
                        </span>

                        <div class="mt-2 flex items-baseline gap-1">

                            <span
                                class="text-3xl lg:text-4xl font-bold text-primary">

                                08

                            </span>

                            <span

                                style="font-variation-settings: 'FILL' 1;">

                                check_circle

                            </span>

                        </div>

                    </div>

                </div>

            </section>

            <!-- PESANAN -->
            <section class="space-y-4">

                <div class="flex justify-between items-center">

                    <h2 class="text-2xl font-semibold">
                        Pesanan Terbaru
                    </h2>
                </div>

                <!-- ORDER 1 -->
                <div
                    class="bg-white p-5 lg:p-6 rounded-2xl border border-outline-variant flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 shadow-sm hover:shadow-md transition-all">

                    <div class="flex items-center gap-4">

                        <div
                            class="w-12 h-12 rounded-xl bg-surface-container-low flex items-center justify-center">

                            <span
                                class="material-symbols-outlined text-primary">

                                shopping_cart

                            </span>

                        </div>

                        <div>

                            <p class="font-semibold text-on-surface">
                                Salad Ayam Bakar
                            </p>

                            <div class="flex items-center gap-2 mt-1">

                                <span
                                    class="text-xs text-on-surface-variant">

                                    #KH-9021

                                </span>

                                <span

                                    •

                                </span>

                                <span
                                    class="text-xs text-on-surface-variant">

                                    Tadi, 12:30

                                </span>

                            </div>

                        </div>

                    </div>

                    <span

                        Diproses

                    </span>

                </div>

                <!-- ORDER 2 -->
                <div
                    class="bg-white p-5 lg:p-6 rounded-2xl border border-outline-variant flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 shadow-sm hover:shadow-md transition-all">

                    <div class="flex items-center gap-4">

                        <div
                            class="w-12 h-12 rounded-xl bg-surface-container-low flex items-center justify-center">

                            <span
                                class="material-symbols-outlined text-primary">

                                shopping_cart

                            </span>

                        </div>

                        <div>

                            <p class="font-semibold text-on-surface">
                                Caffe Latte
                            </p>

                            <div class="flex items-center gap-2 mt-1">

                                <span
                                    class="text-xs text-on-surface-variant">

                                    #KH-8994

                                </span>

                                <span
                                    class="text-xs text-on-surface-variant">

                                    •

                                </span>

                                <span
                                    class="text-xs text-on-surface-variant">

                                    Kemarin, 15:45

                                </span>

                            </div>

                        </div>

                    </div>

                    <span

                        Selesai

                    </span>

                </div>

            </section>

        </div>

    </main>

    <!-- MOBILE NAVBAR -->
<nav
    class="lg:hidden fixed bottom-0 left-0 w-full h-20 bg-white border-t border-outline-variant shadow-sm z-50 flex items-center">

    <!-- HOME -->
    <button
        type="button"
        id="menuHome"
        onclick="goHome()"
        class="flex-1 h-full flex flex-col items-center justify-center text-primary font-semibold transition-colors">

        <span
            class="material-symbols-outlined"
            style="font-variation-settings:'FILL' 1">

            home

        </span>

        <span class="text-[10px] mt-1">
            Beranda
        </span>

    </button>

    <!-- PESANAN -->
    <button
        type="button"
        id="menuKedua"
        onclick="goMenuKedua()"

        <span
            id="iconMenuKedua"
            class="material-symbols-outlined"
            style="font-variation-settings:'FILL' 1">

            shopping_cart

        </span>

        <span
            id="textMenuKedua"
            class="text-[10px] mt-1">

            Pesanan

        </span>

    </button>

    

    </button>

    <!-- STATUS -->
    <button
        type="button"
        id="menuStatus"
        onclick="window.location.href='CekStatus.html'"
        class="flex-1 h-full flex flex-col items-center justify-center text-on-surface-variant font-semibold transition-colors hover:text-primary">

        <span class="material-symbols-outlined">

            notifications

        </span>

        <span class="text-[10px] mt-1">

            Status

        </span>

    </button>

    <!-- AKUN -->
    <button
        type="button"
        id="menuAkun"
        onclick="window.location.href='Profil.html'"
        class="flex-1 h-full flex flex-col items-center justify-center text-on-surface-variant font-semibold transition-colors hover:text-primary">

        <span class="material-symbols-outlined">

            person

        </span>

        <span class="text-[10px] mt-1">

            Akun

        </span>

    </button>

</nav>
    <!-- File JS -->
    <script src="dashboard.js"></script>

</body>
